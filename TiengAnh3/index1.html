    .pbar i{display:block;height:100%;background:var(--brand);width:0%;transition:width .25s}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);

    #notePanel{position:fixed;inset:0;z-index:80;background:rgba(10,25,45,.55);display:none;padding:16px 12px 60px;overflow:auto}

    .det{padding:8px 0;border-bottom:1px solid #e2e7f0;font-size:14px}

    <script>
    const DATA = JSON.parse(document.getElementById('data').textContent);
    const items = DATA.items;

    /* ===== trạng thái ===== */
    let set = [];              // chỉ số các câu trong vòng hiện tại
    let pos = 0;               // vị trí trong vòng
    let round = 1;             // vòng hiện tại
    let totalRounds = 1;
    let answers = {};          // itemIdx -> lựa chọn vòng này
    let locked  = {};          // itemIdx -> đã chọn chưa
    let firstAnswer = {};      // itemIdx -> lựa chọn đầu tiên
    let wrongBook = new Map(); // itemIdx -> {count}  (sổ tay câu sai)

    /* ===== watermark ===== */
    (function(){
    const w = document.getElementById('wm');
    for(let i=0;i<10;i++){
        const s = document.createElement('span');
        s.textContent = 'ĐỀ CƯƠNG · ÔN TẬP';
        s.style.top = (i*120)+'px';
        s.style.left = ((i%3)*260-40)+'px';
        w.appendChild(s);
    }
    })();

    /* ===== text động ===== */
    document.getElementById('gateCount').textContent = `Luyện tập tổng hợp · ${items.length} câu trắc nghiệm · Phải đúng 100%`;
    document.getElementById('headSub').textContent  = `${items.length} câu · Listening · Grammar · Reading · Units 1-6`;

    /* ===== bắt đầu ===== */
    function startExam(){
    const name = document.getElementById('gName').value.trim();
    if(!name){ alert('Vui lòng nhập họ tên'); return; }
    document.getElementById('gate2').style.display='none';
    document.querySelector('header').style.display='block';
    document.getElementById('topbar').style.display='block';
    document.getElementById('mainWrap').style.display='block';
    document.body.style.overflow='auto';
    document.getElementById('noteBtn').classList.add('show');
    startRound(items.map((_,i)=>i), 1);
    }

    function startRound(indices, roundNo){
    set = indices.slice();
    pos = 0;
    round = roundNo;
    totalRounds = Math.max(totalRounds, roundNo);
    answers = {};
    locked  = {};
    const stage = document.getElementById('stage');
    const done  = document.getElementById('done');
    done.style.display = 'none';
    done.innerHTML = '';
    stage.style.display = 'block';
    document.getElementById('topbar').style.display = 'block';
    document.getElementById('noteBtn').classList.add('show');
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    }

    /* ===== render câu hỏi ===== */
    function render(){
    const itemIdx = set[pos];
    const it = items[itemIdx];
    const stage = document.getElementById('stage');

    document.getElementById('counter').textContent =
        `Câu ${pos+1}/${set.length}` + (round > 1 ? ` · Vòng ${round}` : '');
    document.getElementById('pbarfill').style.width = ((pos)/set.length*100)+'%';

    const isLocked = !!locked[itemIdx];
    const picked = answers[itemIdx];
    const isCorrect = isLocked && picked === it.k;

    let h = `<div class="card">
        <div class="kicker"><b>${it.grp||''}</b>${round>1?' · <span style="color:#c23b3b">Làm lại câu sai</span>':''}</div>
        <div class="qtext">Câu ${it.n}. ${it.q}</div>
        <div class="opts">`;
    it.o.forEach((opt,i)=>{
        const L = 'ABCD'[i];
        let cls = 'opt';
        if(isLocked){
        cls += ' locked';
        if(L === picked && L === it.k) cls += ' picked-ok';
        else if(L === picked) cls += ' picked-bad';
        else if(L === it.k) cls += ' show-correct';
        else cls += ' dim';
        }
        const onclick = isLocked ? '' : ` onclick="pick('${L}')"`;
        h += `<div class="${cls}"${onclick}><span class="lt">${L}</span><span>${opt}</span></div>`;
    });
    h += `</div>`;

    if(isLocked){
        if(isCorrect){
        h += `<div class="feedback ok"><b>✔ Chính xác!</b> Đáp án đúng là <b>${it.k}</b>.</div>`;
        } else {
        h += `<div class="feedback bad"><b>✘ Sai rồi.</b> Bạn chọn <b>${picked}</b>. Đáp án đúng là <b>${it.k}</b> — <i>${it.o['ABCD'.indexOf(it.k)]}</i>.<br>
        📝 Câu này đã được ghi vào sổ tay câu sai, bạn sẽ phải làm lại cho đúng.</div>`;
        }
    }

    const isLast = pos === set.length-1;
    h += `<div class="next"><button class="btn" ${isLocked?'':'disabled'} onclick="nextQ()">${isLast?'Kết thúc vòng':'Tiếp theo'}</button></div></div>`;
    stage.innerHTML = h;
    }

    /* ===== chọn đáp án ===== */
    function pick(L){
    const itemIdx = set[pos];
    if(locked[itemIdx]) return;
    if(firstAnswer[itemIdx] === undefined) firstAnswer[itemIdx] = L;
    answers[itemIdx] = L;
    locked[itemIdx]  = true;
    if(L !== items[itemIdx].k){
        const rec = wrongBook.get(itemIdx) || {count:0};
        rec.count++;
        wrongBook.set(itemIdx, rec);
        updateNoteBtn();
    }
    render();
    }

    function nextQ(){
    const itemIdx = set[pos];
    if(!locked[itemIdx]) return;
    if(pos < set.length-1){
        pos++;
        render();
        window.scrollTo({top:0, behavior:'smooth'});
    } else {
        endRound();
    }
    }

    /* ===== kết thúc 1 vòng ===== */
    function endRound(){
    const wrong = set.filter(i => answers[i] !== items[i].k);
    if(wrong.length === 0){ finish(); return; }

    const correctCount = set.length - wrong.length;
    const done = document.getElementById('done');
    document.getElementById('stage').style.display = 'none';

    let h = `<div class="score">
        <div class="big">${correctCount}/${set.length}</div>
        <div class="sm">Vòng ${round} · Đúng ${correctCount} · Còn sai ${wrong.length} câu</div>
        </div>
        <div class="card">
        <div class="kicker"><b>Chưa hoàn thành — còn ${wrong.length} câu sai</b></div>
        <div style="font-size:14px;color:#5d6879;margin-bottom:12px">
            Bạn phải làm đúng <b>tất cả</b> các câu dưới đây mới xem được kết quả cuối.
        </div>`;

    wrong.slice().sort((a,b)=>items[a].n-items[b].n).forEach(i=>{
        const it = items[i];
        h += `<div class="det">
            <div><b>Câu ${it.n}:</b> <span style="color:#c23b3b">✘ Bạn chọn ${answers[i]}</span> — Đáp án đúng: <b style="color:#15774e">${it.k}</b></div>
            <div class="det-sub">${it.o['ABCD'.indexOf(it.k)]}</div>
        </div>`;
    });

    h += `<div class="next"><button class="btn" onclick="startRound(${JSON.stringify(wrong)}, ${round+1})">
            🔁 Làm lại ${wrong.length} câu sai</button></div>
        </div>
        <div class="card">
        <button class="btn" style="background:#5d6879" onclick="toggleNotes()">📝 Xem sổ tay câu sai (${wrongBook.size})</button>
        </div>`;

    done.innerHTML = h;
    done.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    }

    /* ===== hoàn thành 100% ===== */
    function finish(){
    const done = document.getElementById('done');
    document.getElementById('stage').style.display = 'none';
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('noteBtn').classList.remove('show');
    document.getElementById('pbarfill').style.width = '100%';

    const total   = items.length;
    const firstTry = items.reduce((s,it,i)=> s + (firstAnswer[i]===it.k ? 1 : 0), 0);
    const noted    = wrongBook.size;

    let h = `<div class="score">
        <div class="big">${total}/${total}</div>
        <div class="sm">🎉 Hoàn thành · Tất cả ${total} câu đã đúng 100%</div>
        </div>
        <div class="card">
        <div class="kicker"><b>Tổng kết</b></div>
        <div style="font-size:14.5px;line-height:1.9">
            • Số vòng đã làm: <b>${totalRounds}</b><br>
            • Đúng ngay lần đầu: <b>${firstTry}/${total}</b><br>
            • Số câu từng sai (đã ghi chú): <b>${noted}</b>
        </div>
        </div>
        <div class="card">
        <div class="kicker"><b>Chi tiết từng câu</b></div>
        ${items.map((it,i)=>{
            const first = firstAnswer[i];
            const okFirst = first === it.k;
            const cnt = (wrongBook.get(i)||{count:0}).count;
            return `<div class="det">
            <div><b>Câu ${it.n}:</b> ${okFirst
                ? '<span style="color:#15774e">✔ Đúng ngay lần đầu</span>'
                : `<span style="color:#c23b3b">↻ Sai lần đầu (chọn ${first}) — đã sửa đúng</span>`}</div>
            <div class="det-sub">Đáp án: <b>${it.k}</b> — ${it.o['ABCD'.indexOf(it.k)]}${okFirst?'':` · Sai ${cnt} lần`}</div>
            </div>`;
        }).join('')}
        </div>
        <div class="card"><button class="btn" onclick="location.reload()">Làm lại từ đầu</button></div>`;

    done.innerHTML = h;
    done.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    }

    /* ===== sổ tay câu sai ===== */
    function updateNoteBtn(){
    document.getElementById('noteBtn').textContent = `📝 Câu sai (${wrongBook.size})`;
    }

    function toggleNotes(){
    const p = document.getElementById('notePanel');
    p.classList.toggle('on');
    if(p.classList.contains('on')) renderNotes();
    }

    function renderNotes(){
    const list = document.getElementById('noteList');
    if(wrongBook.size === 0){
        list.innerHTML = '<div style="color:#5d6879;font-size:14px">Chưa có câu sai nào. Cố gắng nhé!</div>';
        return;
    }
    const arr = [...wrongBook.entries()].sort((a,b)=> items[a[0]].n - items[b[0]].n);
    list.innerHTML = arr.map(([i,info])=>{
        const it = items[i];
        return `<div class="note-item">
        <div class="ni-head">Câu ${it.n} · ${it.grp||''}</div>
        <div class="ni-q">${it.q}</div>
        <div class="ni-a">✔ Đáp án đúng: <b>${it.k}</b> — ${it.o['ABCD'.indexOf(it.k)]}</div>
        <div class="ni-m">Đã sai ${info.count} lần</div>
        </div>`;
    }).join('');
    }
    </script>
    </body>
    </html>
